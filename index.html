<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abholsystem – Tagesansicht</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
  :root{--fg:#1a202c;--muted:#64748b;--accent:#4299e1;--bg:#f0f4f8;--white:#fff}
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
  .wrap{max-width:780px;margin:0 auto;padding:16px}
  h1{margin:10px 0;text-align:center;font-size:22px}
  .row{display:flex;gap:8px;justify-content:center;margin:8px 0}
  button{padding:9px 14px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer}
  button.secondary{background:#64748b}
  button.unlock-btn {
    background: #f6ad55;
    color: #fff;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.unlock-btn.active {
    background: #48bb78;
  }
  .status-info {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    background: #48bb78;
    color: #fff;
    white-space: nowrap;
  }
  #info{text-align:center;margin:6px 0;color:#475569}
  .slot{background:var(--white);border-radius:10px;padding:10px 12px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .slot h2{margin:0 0 8px 0;font-size:16px;display:flex;justify-content:space-between;align-items:center;}
  .slot h2 span { line-height: 1; }
  .names{list-style:none;margin:0;padding:0}
  .names li{padding:4px 0;font-size:16px;line-height:1.35}
  .strike{text-decoration:line-through;color:#e53e3e}
  .onetime{color:#f6e05e}
  .modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.4);justify-content:center;align-items:center}
  .box{background:#fff;padding:16px;border-radius:10px;width:min(92vw,520px)}
  .days{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
  .days button{background:#e2e8f0;color:#334155}
  .days button.active{background:#38a169;color:#fff}
  #link-view{display:none;min-height:50vh;align-items:center;justify-content:center;}
  
  #link-msg{
    background:#fff;
    padding:30px 26px;
    border-radius:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    font-size:24px;
    text-align:center;
    line-height:1.4;
    transition: background-color 0.3s ease;
  }
  #link-msg.locked { background-color: #fcebeb; border: 3px solid #e53e3e; } 
  #link-msg.success { background-color: #ebf8f5; border: 3px solid #38a169; color: #38a169; }
  #link-msg.already { background-color: #fffbeb; border: 3px solid #f6ad55; color: #f6ad55; }

  .progress-container { background: #e2e8f0; border-radius: 8px; height: 16px; margin: 15px 0 5px 0; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: #48bb78; transition: width 0.5s ease-out; }
  .progress-bar.warning { background: #f6ad55; }

  /* NEU: Toast-Popup für Freischaltungen */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #38a169; color: #fff; padding: 12px 24px; border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2); z-index: 2000; font-weight: bold;
    opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* NEU: Sperrbildschirm (Großes X) */
  #lock-screen {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; text-align: center; margin-top: 20px;
  }
  .big-x { font-size: 120px; color: #e53e3e; line-height: 1; margin-bottom: 20px; font-weight: 900; }
  .lock-text { font-size: 26px; color: #1a202c; font-weight: bold; }
</style>
</head>
<body>
<!-- NEU: Toast Notification -->
<div id="toast" class="toast"></div>

<div class="wrap">
  <h1 id="title">Tagesansicht</h1>

  <div id="controls" class="row" style="display:none">
    <button id="chooseDayBtn" class="secondary">Wochentag wählen</button>
    <button id="manualBtn" class="secondary">Manuell abmelden</button>
    <button id="adminLinkBtn">Abholzeit anpassen</button>
  </div>

  <div id="info">Lade…</div>
  <div id="slots"></div>
  <div id="link-view"><div id="link-msg"></div></div>

  <!-- NEU: Sperrbildschirm -->
  <div id="lock-screen">
    <div class="big-x">X</div>
    <div class="lock-text">Das Abmelden ist im Moment nicht möglich</div>
  </div>
</div>

<div id="dayModal" class="modal"><div class="box">
  <h3>Wochentag auswählen</h3>
  <div id="dayBtns" class="days"></div>
  <div class="row" style="margin-top:10px"><button id="closeDay" class="secondary">Schließen</button></div>
</div></div>

<script>
  const appAbhol = firebase.initializeApp({
    apiKey:"AIzaSyA9TnOd0oTD0tTNEqMi_7PHU-p0av-XjM0",
    databaseURL:"https://abab-58a5f-default-rtdb.europe-west1.firebasedatabase.app"
  }, "abhol");
  const dbAbhol = firebase.app("abhol").database();

  const appMode = firebase.initializeApp({
    apiKey:"AIzaSyAQaNKUa-RKvUcwlPpWnEyKxcVjYV6cZuU",
    databaseURL:"https://gesamt-dae4e-default-rtdb.europe-west1.firebasedatabase.app"
  }, "mode");
  const dbGesamt = firebase.app("mode").database();

  function berlinParts(d=new Date()){
    const fmt = new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour12:false,
      year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'long'});
    const parts = fmt.formatToParts(d); const get=t=>parts.find(p=>p.type===t)?.value;
    return {y:Number(get('year')), m:get('month'), d:get('day'),
            h:Number(get('hour')), min:Number(get('minute')), weekday:get('weekday')};
  }
  function dateKey(){ const p=berlinParts(); return `${p.y}-${p.m}-${p.d}`; }
  function todayName(){ const w=berlinParts().weekday; return w.charAt(0).toUpperCase()+w.slice(1); }
  function nowMinutes(){ const p=berlinParts(); return p.h*60+p.min; }
  function parseHHMM(s){ if(!s||!/^\d{2}:\d{2}$/.test(s)) return null; const [h,m]=s.split(':').map(Number); return h*60+m; }

  const SCHOOL=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
  const qs = s=>document.querySelector(s);

  let currentDay=todayName();
  const params=new URLSearchParams(location.search);
  const linkChild=params.get('child');
  const isAdmin=params.get('admin')==='1'; 

  const titleEl=qs('#title'), infoEl=qs('#info'), slotsEl=qs('#slots');
  const controls = document.getElementById('controls');
  const linkMsgEl = document.getElementById('link-msg');
  
  let unlockedTimes = new Set(); 
  
  // NEU: Globale Variablen für Sperre und Listener
  let isSystemLocked = false;
  let dayLockRef = null;
  let activeUnlockRef = null;

  qs('#chooseDayBtn').onclick=()=>openDayModal();
  qs('#closeDay').onclick=()=>qs('#dayModal').style.display='none';
  qs('#manualBtn').onclick=()=>{ location.href='manuell.html'; };
  qs('#adminLinkBtn').onclick=()=>{ location.href='admin.html'; };

  function openDayModal(){
    const c=qs('#dayBtns'); c.innerHTML='';
    SCHOOL.forEach(d=>{
      const b=document.createElement('button');
      b.textContent=d;
      if(d===currentDay) b.classList.add('active');
      b.onclick=()=>{ currentDay=d; qs('#dayModal').style.display='none'; loadDay(); };
      c.appendChild(b);
    });
    qs('#dayModal').style.display='flex';
  }

  // NEU: Toast-Funktion anzeigen
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => { t.classList.remove('show'); }, 4000);
  }

  function enterLinkMode(msg, isLocked=false, progressHTML='', statusType=null){ 
    linkMsgEl.innerHTML=msg + (progressHTML && !isLocked ? `<br>` : ``) + progressHTML;
    linkMsgEl.classList.remove('locked', 'success', 'already');
    if (isLocked) linkMsgEl.classList.add('locked');
    if (statusType) linkMsgEl.classList.add(statusType);
    
    document.getElementById('link-view').style.display='flex';
    document.getElementById('slots').style.display='none';
    if (controls) controls.style.display='none';
    document.getElementById('chooseDayBtn')?.setAttribute('disabled','true');
    document.getElementById('adminLinkBtn')?.setAttribute('disabled','true');
    document.getElementById('manualBtn')?.setAttribute('disabled','true');
    history.pushState(null,'',location.href);
    window.addEventListener('popstate',()=>{ history.pushState(null,'',location.href); });
  }

  // NEU: Listener für System-Sperre und Live-Freischaltungen
  function updateRealtimeRefs() {
    if(dayLockRef) { dayLockRef.off(); dayLockRef = null; }
    if(activeUnlockRef) { activeUnlockRef.off(); activeUnlockRef = null; }

    if(currentDay === todayName()) {
      // 1. Systemsperre-Listener
      dayLockRef = dbAbhol.ref(`dayLocks/${dateKey()}`);
      dayLockRef.on('value', snap => {
        isSystemLocked = snap.val() === true;
        const lockScreen = qs('#lock-screen');
        
        if(isSystemLocked) {
          slotsEl.style.display = 'none';
          if(controls) controls.style.display = 'none';
          infoEl.style.display = 'none';
          
          if(linkChild) {
            enterLinkMode(`Das Abmelden ist im Moment nicht möglich`, true);
          } else {
            lockScreen.style.display = 'flex';
          }
        } else {
          lockScreen.style.display = 'none';
          infoEl.style.display = 'block';
          if(!linkChild && controls) controls.style.display = 'flex';
          slotsEl.style.display = 'block';
          
          // Ansicht neu laden, wenn wir nicht im Link-Modus sind
          if(!linkChild) loadDay(true);
        }
      });

      // 2. Zeit-Freischaltungs-Listener
      activeUnlockRef = dbAbhol.ref(`timeUnlocks/${dateKey()}`);
      let initialLoad = true;
      
      activeUnlockRef.on('child_added', snap => {
        const time = snap.key;
        unlockedTimes.add(time);
        if(!initialLoad) {
          showToast(`${time} Uhr abmelden vom Admin freigegeben`);
          // Buttons sofort aktualisieren (nur im Haupt-Tablet)
          if(!linkChild && !isSystemLocked) loadDay(true);
        }
      });
      activeUnlockRef.on('child_removed', snap => {
        unlockedTimes.delete(snap.key);
        if(!initialLoad && !linkChild && !isSystemLocked) loadDay(true);
      });
      activeUnlockRef.once('value', () => { initialLoad = false; });
    } else {
      isSystemLocked = false;
      qs('#lock-screen').style.display = 'none';
    }
  }
  
  async function loadUnlocks(){
    unlockedTimes.clear();
    if(currentDay!==todayName()) return;
    try {
        const snap = await dbAbhol.ref(`timeUnlocks/${dateKey()}`).once('value');
        const unlocks = snap.val() || {};
        Object.keys(unlocks).forEach(time => {
            if(unlocks[time]===true) unlockedTimes.add(time);
        });
    } catch(e) { console.error(e); }
  }

  window.toggleTimeUnlock = async function(time){ 
    if (currentDay !== todayName()) return;
    const ref = dbAbhol.ref(`timeUnlocks/${dateKey()}/${time}`);
    const isUnlocked = unlockedTimes.has(time);
    infoEl.textContent = 'Speichere Status...';
    try{
        if(isUnlocked) await ref.set(null);
        else await ref.set(true);
    } catch(e) { console.error(e); }
  }

  // ANGEPASST: loadDay beachtet nun den Sperr-Zustand und Realtime-Listener
  async function loadDay(skipRefs = false){
    titleEl.textContent=`Heute: ${currentDay}`;
    
    // Setze Listener auf (falls nicht durch einen internen Reload aufgerufen)
    if (!skipRefs) updateRealtimeRefs();

    if (!linkChild) { controls.style.display='flex'; } else { controls.style.display='none'; }
    if(!SCHOOL.includes(currentDay)){ infoEl.textContent='Kein OGS-Tag. Nur Mo–Fr.'; slotsEl.innerHTML=''; return; }
    
    infoEl.textContent='Lade…'; slotsEl.innerHTML='';
    
    if(currentDay===todayName()){ 
      // Prüfe sofort den Sperrzustand
      const lockSnap = await dbAbhol.ref(`dayLocks/${dateKey()}`).once('value');
      if (lockSnap.val() === true) {
         if (linkChild) enterLinkMode(`Das Abmelden ist im Moment nicht möglich`, true);
         return; // Render abbrechen, Lock-Screen wird vom Listener gezeigt
      }
      await loadUnlocks(); 
    } else { 
      unlockedTimes.clear(); 
    }

    try{
      const timesSnap=await dbAbhol.ref(currentDay).once('value');
      const times=timesSnap.val()||{};

      if(linkChild){
        const statusNow=(await dbAbhol.ref(`abmeldungen/${dateKey()}`).once('value')).val()||{};
        await tryAutoCheckout(times,statusNow);
        return;
      }

      const isTodaySelected=(currentDay===todayName());
      let status={}, onetime={};
      if(isTodaySelected){
        [status,onetime]=await Promise.all([
          dbAbhol.ref(`abmeldungen/${dateKey()}`).once('value').then(s=>s.val()||{}),
          dbAbhol.ref(`onetime/${dateKey()}`).once('value').then(s=>s.val()||{})
        ]);
      }

      const rows=Object.entries(times).map(([name,baseTime])=>{
        const finalTime=(isTodaySelected && onetime[name]) ? onetime[name] : (baseTime||null);
        const isOnetime=isTodaySelected && !!onetime[name];
        const strike=isTodaySelected && !!status[name];
        return {name, finalTime, isOnetime, strike};
      });

      const groups={};
      rows.forEach(r=>{ const t=r.finalTime||'—'; (groups[t] ||= []).push(r); });

      const sortedTimes=Object.keys(groups).sort((a,b)=>{
        const am=parseHHMM(a), bm=parseHHMM(b);
        if(am===null && bm===null) return 0;
        if(am===null) return 1;
        if(bm===null) return -1;
        return am-bm;
      });

      if(sortedTimes.length===0){ infoEl.textContent='Keine Einträge für heute.'; return; }

      const nowMins = nowMinutes();

      sortedTimes.forEach(t=>{
        const slot=document.createElement('div'); slot.className='slot';
        
        let slotTitle = t==='—' ? 'ohne Zeit' : t+' Uhr';
        let buttonHTML = '';
        
        const targetMins = parseHHMM(t);
        const allowedFromMins = targetMins !== null ? targetMins - 2 : null;
        
        if (currentDay===todayName() && t !== '—') {
            if (targetMins !== null && nowMins >= allowedFromMins) {
                buttonHTML = `<span class="status-info">Abmeldung möglich</span>`;
            } else {
                const isUnlocked = unlockedTimes.has(t);
                const btnText = isUnlocked ? 'Rückgängig' : 'Abmelden jetzt ermöglichen';
                const btnClass = isUnlocked ? 'unlock-btn active' : 'unlock-btn';
                buttonHTML = `<button class="${btnClass}" onclick="toggleTimeUnlock('${t}')">${btnText}</button>`;
            }
        }

        slot.innerHTML=`<h2><span>${slotTitle}</span>${buttonHTML}</h2><ul class="names"></ul>`;
        
        const ul=slot.querySelector('.names');
        groups[t].sort((a,b)=>a.name.localeCompare(b.name,'de')).forEach(r=>{
          const li=document.createElement('li');
          if(r.strike) li.classList.add('strike');
          if(r.isOnetime) li.classList.add('onetime');
          li.textContent=r.name;
          ul.appendChild(li);
        });
        slotsEl.appendChild(slot);
      });

      infoEl.textContent='Fertig.';
    }catch(e){
      console.error(e);
      infoEl.textContent='Fehler beim Laden. Regeln/Verbindung prüfen.';
    }
  }

  async function tryAutoCheckout(times,status){
    // NEU: Auto-Checkout stoppen wenn System gesperrt ist
    if (isSystemLocked) {
      return enterLinkMode(`Das Abmelden ist im Moment nicht möglich`, true);
    }

    const name = linkChild;
    const now = Date.now();
    const systemModeRef = dbGesamt.ref("systemmode/state");
    const kindRef = dbGesamt.ref(`kinder/${name}`);
    const linkFailsRef = dbAbhol.ref(`linkFails/${dateKey()}/${name}`);
    const SperrGrundAutomatisch = "Terminal benutzt im gesperrten Modus";
    const SperrDauer = 10 * 60 * 1000;
    
    const kindSnap = await kindRef.once('value');
    const kindData = kindSnap.val() || {};
    
    if (kindData.gesperrt === true) {
      const sperrBis = kindData.sperrBis || 0;
      const restZeitMs = sperrBis - now;
      const istAutomatischeSperre = kindData.sperrGrund === SperrGrundAutomatisch;
      
      let msg;
      if (restZeitMs > 0) {
        const restMin = Math.ceil(restZeitMs / 60000);
        msg = `Dein Konto wurde gesperrt! Grund: ${kindData.sperrGrund || 'Nicht angegeben'}. Deine Zugangssperre dauert noch ${restMin} Minute(n).`;
      } else if (istAutomatischeSperre) {
        await kindRef.update({ gesperrt: null, sperrGrund: null, sperrBis: null });
        return continueCheckout(times, status, name);
      } else {
        msg = `${name}: Dein Konto ist gesperrt! Grund: ${kindData.sperrGrund || 'Nicht angegeben'}.`;
      }
      enterLinkMode(msg, true);
      return;
    }
    
    const modeSnap = await systemModeRef.once("value");
    const rawMode = modeSnap.val().value || "green";

    if (rawMode === 'red') {
      let failsSnap = await linkFailsRef.once('value');
      let fails = failsSnap.val() || [];
      
      fails = fails.filter(ts => now - ts < 5 * 60 * 1000);
      fails.push(now);
      
      if (fails.length >= 2) {
        const sperrBis = now + SperrDauer;
        await kindRef.update({ gesperrt: true, sperrGrund: SperrGrundAutomatisch, sperrBis: sperrBis });
        await linkFailsRef.set(null);
        const msg = `Dein Konto wurde gesperrt! Grund: ${SperrGrundAutomatisch}. Du hast für 10 Minuten keinen Zugriff auf dein Konto.`;
        enterLinkMode(msg, true);
        return;
      } else {
        await linkFailsRef.set(fails);
        const msg = `Warnung! Nutze das Terminal nicht im gesperrten Modus. Beim nächsten Versuch wird dein Konto für 10 Minuten gesperrt.`;
        enterLinkMode(msg, true);
        return;
      }
    } 

    return continueCheckout(times, status, name);
  }

  async function continueCheckout(times, status, name) {
    const setRef=dbAbhol.ref(`abmeldungen/${dateKey()}/${name}`);

    if(!times || !times[name]) return enterLinkMode(`Unbekanntes Kind: ${name}.`);
    if(status && status[name]) return enterLinkMode(`${name}: bereits abgemeldet.`, false, '', 'already');

    const otSnap=await dbAbhol.ref(`onetime/${dateKey()}/${name}`).once('value');
    const specialTime=otSnap.val();
    const baseTime=String(times[name]);
    const t=specialTime || baseTime;
    
    let isTimeUnlocked = false;
    if (t !== '—') {
        const unlockSnap = await dbAbhol.ref(`timeUnlocks/${dateKey()}/${t}`).once('value');
        isTimeUnlocked = unlockSnap.val() === true;
    }

    const target=parseHHMM(t);
    const allowedFrom=target!==null ? target-2 : null;
    const now = nowMinutes();

    if(isAdmin || isTimeUnlocked || allowedFrom===null || now >= allowedFrom){
      try{ 
        await setRef.set(true); 
        dbAbhol.ref(`linkFails/${dateKey()}/${name}`).set(null);
        enterLinkMode(`${name}: erfolgreich abgemeldet.`, false, '', 'success'); 
      }
      catch{ enterLinkMode(`${name}: Abmeldung fehlgeschlagen.`); }
    }else{
      const wait=Math.max(0, allowedFrom-now);
      const startTimeMinutes = 720; // 12:00 Uhr
      const totalSpan = allowedFrom - startTimeMinutes;
      const elapsed = now - startTimeMinutes;

      let progress = 0;
      if (totalSpan > 0) {
        progress = Math.min(100, Math.max(0, (elapsed / totalSpan) * 100));
      }
      
      let progressClass = progress < 50 ? '' : 'warning'; 
      const progressHTML = `
        <div class="progress-container">
          <div class="progress-bar ${progressClass}" style="width: ${progress.toFixed(0)}%;"></div>
        </div>
      `;
      
      const waitMessage = `${name} bitte noch ${wait} Minuten warten.`;
      const timeMessage = `Deine Abholzeit für heute ist ${t} Uhr.`;
      
      enterLinkMode(`${waitMessage}<br>${timeMessage}`, false, progressHTML);
    }
  }

  document.addEventListener('DOMContentLoaded',loadDay);
</script>
</body>
</html>
